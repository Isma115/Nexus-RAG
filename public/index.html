<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus-rag · RAG local</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <h1>nexus-rag</h1>
  <p>RAG local · fuentes locales hoy, resto preparado · multi-usuario a futuro</p>
  <div class="row">
    <button id="btnOffline">Entrar offline</button>
    <span id="me"></span>
  </div>
</header>
<main>
  <section>
    <h2>1 · Fuente local</h2>
    <div class="row">
      <input id="srcName" placeholder="Nombre fuente (ej. docs)">
      <input id="srcPath" placeholder="Ruta local (ej. ./docs)">
      <button id="btnSource">Crear + indexar</button>
    </div>
    <ul id="sources"></ul>
  </section>
  <section>
    <h2>2 · Pregunta a tus documentos</h2>
    <div class="row">
      <input id="q" placeholder="¿Qué dicen tus documentos sobre…?">
      <input id="topK" type="number" value="6" min="1" max="20">
      <button id="btnAsk">Preguntar</button>
    </div>
    <pre id="answer"></pre>
    <ul id="cites"></ul>
  </section>
  <section>
    <h2>3 · Conversación (itera)</h2>
    <div class="row">
      <button id="btnConv">Nueva conversación</button>
      <span id="convId"></span>
    </div>
    <ul id="history"></ul>
  </section>
</main>
<script src="./app.js"></script>
</body>
</html>
